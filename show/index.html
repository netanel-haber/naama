<!DOCTYPE HTML>
<html dir="rtl" lang="he">

<head>
	<title>מתיש להיות אני - נעמה רודריגז בהופעת סטנדאפ מלאה</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Rubik+Distressed&display=swap" />
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			min-height: 100svh;
			font-family: 'Rubik Distressed', cursive, "Source Sans Pro", sans-serif;
			font-weight: normal;
			color: #ffffff;
			background-color: #140026;
			background: rgba(2, 0, 36, 0.523);
			background: linear-gradient(90deg, rgba(2, 0, 36, 0.402) 0%, rgba(86, 6, 172, 0.61) 62%, rgba(86, 1, 125, 0.778) 100%);
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.wrap {
			width: 45em;
			max-width: calc(100% - 2em);
			margin: 0 auto;
			padding: 1.5em 0;
			text-align: center;
		}

		@media screen and (min-width: 900px) {
			.wrap {
				width: 70em;
			}

			h1 {
				font-size: 2.3em;
			}
		}

		.back {
			display: inline-block;
			flex: 0 0 auto;
			color: #ffffff;
			text-decoration: none;
			border: 1px solid rgba(255, 255, 255, 0.5);
			border-radius: 0.5em;
			padding: 0.5em 1em;
			font-size: 0.95em;
			transition: background-color 0.2s ease, border-color 0.2s ease;
		}

		.back:hover {
			background-color: rgba(255, 255, 255, 0.125);
			border-color: #ffffff;
		}

		h1 {
			font-size: 1.8em;
			line-height: 1.3em;
			margin: 0.5em 0 1em 0;
		}

		@media screen and (max-width: 480px) {
			h1 {
				font-size: 1.35em;
			}
		}

		.video-box {
			position: relative;
			width: 100%;
			padding-top: 56.25%;
			background: #000;
			border-radius: 0.75em;
			overflow: hidden;
			box-shadow: 0 0 2em rgba(0, 0, 0, 0.5);
		}

		.video-box iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}

		.button-row {
			display: flex;
			gap: 1em;
			justify-content: center;
			margin-top: 2em;
		}

		.back,
		.more {
			text-align: center;
		}

		.more {
			display: inline-block;
			flex: 0 0 auto;
			color: #ffffff;
			text-decoration: none;
			background-color: rgba(255, 0, 90, 0.75);
			border-radius: 0.5em;
			padding: 0.5em 1em;
			font-size: 0.95em;
			transition: background-color 0.2s ease;
		}

		.more:hover {
			background-color: rgba(255, 0, 90, 1);
		}

		footer {
			text-align: center;
			padding: 1em 0;
			font-size: 0.85em;
			opacity: 0.8;
		}

		footer a {
			color: #ffffff;
		}
	</style>
</head>

<body>
	<div class="wrap">
		<h1>מתיש להיות אני - נעמה רודריגז בהופעת סטנדאפ מלאה</h1>

		<div class="video-box">
			<iframe src="https://www.youtube.com/embed/pm2Jrm2CU9g" title="מתיש להיות אני - נעמה רודריגז בהופעת סטנדאפ מלאה"
				allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				allowfullscreen></iframe>
		</div>

		<div class="button-row">
			<a href="/" class="back">חזרה לדף הבית</a>
			<a href="https://www.youtube.com/@naamarodrigues5040" target="_blank" rel="noopener" class="more">לעוד תכנים</a>
		</div>
	</div>

	<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "927fd5c02c8e49f68d035e855398784f"}'></script><!-- End Cloudflare Web Analytics -->
</body>

</html>
